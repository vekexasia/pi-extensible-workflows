name: Publish package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify tag matches package versions
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          cli_version=$(node -p "require('./packages/cli/package.json').version")
          herdr_version=$(node -p "require('./packages/extensions/herdr/package.json').version")
          root_version=$(node -p "require('./package.json').version")
          if [ "$version" != "$root_version" ] || [ "$version" != "$cli_version" ] || [ "$version" != "$herdr_version" ]; then
            echo "Package versions differ: root=$root_version core=$version cli=$cli_version herdr=$herdr_version" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Verify package artifacts
        run: npm run test:packages -- "$RUNNER_TEMP/piewf-packages"
      - name: Publish missing packages
        run: |
          publish() {
            workspace=$1
            name=$(node -p "require('./$workspace/package.json').name")
            version=$(node -p "require('./$workspace/package.json').version")
            filename="${name#@}"
            filename="${filename/\//-}-$version.tgz"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              case "$version" in *-*) tag=next;; *) tag=latest;; esac
              npm publish "$RUNNER_TEMP/piewf-packages/$filename" --access public --tag "$tag"
            fi
          }
          publish packages/core
          publish packages/cli
          publish packages/extensions/herdr
